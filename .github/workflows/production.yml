# SCRUM-65 - DevOps: Pipeline de despliegue final hacia Producción.
#
# Simulación del entorno de Producción (el equipo aún no cuenta con un
# servidor real). Se activa solo con un tag de versión (ej. v1.0.0),
# nunca automáticamente con cada push, y requiere que la auditoría final
# de SonarQube (SCRUM-64) haya pasado antes de continuar.
#
# Flujo: Tag de versión -> Verificación completa -> Aprobación manual
#        (Environment protection) -> Deploy simulado a Producción.

name: Deploy to Production

on:
  push:
    tags:
      - 'v*.*.*'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  # ── 1. Verificación completa (mismo gate que Staging) ────────────────────
  backend-checks:
    name: Backend Checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo, pdo_mysql, openssl
          coverage: xdebug

      - name: Copy .env
        run: php -r "file_exists('.env') || copy('.env.example', '.env');"

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Code style (Pint)
        run: ./vendor/bin/pint --test

      - name: Static analysis (PHPStan)
        run: composer analyse

      - name: Run tests
        run: php artisan config:clear && vendor/bin/phpunit

  frontend-checks:
    name: Frontend Checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: '20'
          cache: 'yarn'
          cache-dependency-path: frontend/yarn.lock

      - name: Install dependencies
        run: yarn install --ignore-scripts --frozen-lockfile

      - name: ESLint
        run: yarn lint

      - name: Build
        run: yarn build

  # ── 2. Pruebas E2E sobre el build (SCRUM-63) ─────────────────────────────
  e2e-tests:
    name: End-to-End Tests
    runs-on: ubuntu-latest
    needs: [ backend-checks, frontend-checks ]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: '20'
          cache: 'yarn'
          cache-dependency-path: frontend/yarn.lock

      - name: Install frontend dependencies
        working-directory: frontend
        run: yarn install --ignore-scripts --frozen-lockfile

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx --no-install playwright install --with-deps chromium

      - name: Run E2E suite
        working-directory: frontend
        run: npx --no-install playwright test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@6f51ac03b9356f520e9adb1b1b7802705f340c2b # v4.4.3
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 14

  # ── 3. Aprobación manual + Deploy real a Producción (EC2) ────────────────
  # El "environment: production" con reviewers configurados en GitHub
  # Settings obliga a que un humano apruebe antes de que este job corra.
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [ e2e-tests ]
    environment: production

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Show release info
        run: |
          echo "Desplegando versión: ${GITHUB_REF_NAME}"
          echo "Commit: ${GITHUB_SHA}"

      # ── Deploy real al servidor EC2 vía SSH ──────────────────────────────
      # Secrets requeridos en GitHub → Settings → Secrets → Actions:
      #   EC2_HOST          → IP o DNS público de la instancia EC2
      #   EC2_USER          → Usuario SSH (ej: ubuntu, ec2-user)
      #   EC2_SSH_KEY       → Clave privada PEM (contenido completo del .pem)
      #   EC2_PROJECT_DIR   → Ruta del proyecto en EC2 (ej: /home/ubuntu/T3-Prolecom)
      #   JUDGE0_URL        → URL del servidor Judge0
      #   JUDGE0_HOST       → Host de Judge0
      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@2a0b0f6f0a04e3e854e6f98e35e28fdb1e48a0cd # v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            cd ${{ secrets.EC2_PROJECT_DIR }}

            echo "==> Actualizando código..."
            git pull origin main

            echo "==> Reconstruyendo y reiniciando servicios Docker..."
            docker compose pull db judge0-db judge0-redis judge0-server adminer
            docker compose up -d --build \
              --no-deps \
              backend \
              reverb \
              queue-worker \
              frontend

            echo "==> Esperando que el backend esté listo..."
            sleep 8

            echo "==> Verificando .env del backend..."
            if [ ! -f backend/.env ]; then
              echo "No existe .env — creando desde .env.example..."
              cp backend/.env.example backend/.env
              docker compose run --rm backend php artisan key:generate --force
            fi

            echo "==> Ejecutando migraciones..."
            docker compose exec -T backend php artisan migrate --force

            echo "==> Limpiando caché de Laravel..."
            docker compose exec -T backend php artisan config:cache
            docker compose exec -T backend php artisan route:cache
            docker compose exec -T backend php artisan view:cache

            echo "==> Estado final de los servicios:"
            docker compose ps

            echo "✅ Deploy ${GITHUB_REF_NAME} completado exitosamente."

      - name: Notify deploy success
        if: success()
        run: |
          echo "🚀 Deploy ${GITHUB_REF_NAME} → EC2 completado."
          echo "Commit: ${GITHUB_SHA}"

      - name: Notify deploy failure
        if: failure()
        run: |
          echo "❌ Deploy falló. Revisar logs de SSH."