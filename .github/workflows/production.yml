# SCRUM-65 - DevOps: Pipeline de despliegue final hacia Producción.
#
# Simulación del entorno de Producción (el equipo aún no cuenta con un
# servidor real). Se activa solo con un tag de versión (ej. v1.0.0),
# nunca automáticamente con cada push, y requiere que la auditoría final
# de SonarQube (SCRUM-64) haya pasado antes de continuar.
#
# Flujo: Tag de versión -> Verificación completa -> Aprobación manual
#        (Environment protection) -> Deploy simulado a Producción.

name: Deploy to Production

on:
  push:
    tags:
      - 'v*.*.*'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  # ── 1. Verificación completa (mismo gate que Staging) ────────────────────
  backend-checks:
    name: Backend Checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo, pdo_mysql, openssl
          coverage: xdebug

      - name: Copy .env
        run: php -r "file_exists('.env') || copy('.env.example', '.env');"

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Code style (Pint)
        run: ./vendor/bin/pint --test

      - name: Static analysis (PHPStan)
        run: composer analyse

      - name: Run tests
        run: php artisan config:clear && vendor/bin/phpunit

  frontend-checks:
    name: Frontend Checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: '20'
          cache: 'yarn'
          cache-dependency-path: frontend/yarn.lock

      - name: Install dependencies
        run: yarn install --ignore-scripts --frozen-lockfile

      - name: ESLint
        run: yarn lint

      - name: Build
        run: yarn build

  # ── 2. Pruebas E2E sobre el build (SCRUM-63) ─────────────────────────────
  e2e-tests:
    name: End-to-End Tests
    runs-on: ubuntu-latest
    needs: [ backend-checks, frontend-checks ]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: '20'
          cache: 'yarn'
          cache-dependency-path: frontend/yarn.lock

      - name: Install frontend dependencies
        working-directory: frontend
        run: yarn install --ignore-scripts --frozen-lockfile

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx --no-install playwright install --with-deps chromium

      - name: Run E2E suite
        working-directory: frontend
        run: npx --no-install playwright test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@6f51ac03b9356f520e9adb1b1b7802705f340c2b # v4.4.3
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 14

  # ── 3. Aprobación manual + Deploy simulado a Producción ──────────────────
  # El "environment: production" con reviewers configurados en GitHub
  # Settings obliga a que un humano apruebe antes de que este job corra.
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [ e2e-tests ]
    environment: production

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Show release info
        run: |
          echo "Desplegando versión: ${GITHUB_REF_NAME}"
          echo "Commit: ${GITHUB_SHA}"

      # Placeholder: el equipo aún no tiene servidor real de producción.
      # Cuando exista, reemplazar este paso por el deploy real
      # (SSH, contenedor, Vercel, servicio cloud, etc.), siguiendo el
      # mismo patrón usado en staging.yml.
      - name: Simulated production deploy
        run: |
          echo "Ejecutando despliegue simulado a Producción..."
          echo "Backend: build listo para desplegar."
          echo "Frontend: build listo para desplegar."
          echo "✅ Despliegue simulado completo. Producto certificado y listo para servidor real."