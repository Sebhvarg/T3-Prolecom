# SCRUM-52 - CI/CD: Staging workflow
# Se ejecuta cuando se hace merge a master (después de pasar dev)
# Despliega automáticamente al entorno de Staging para smoke testing

name: Deploy to Staging

on:
  push:
    branches: [ "master" ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  # ── 1. Backend CI ─────────────────────────────────────────────────────────
  backend-checks:
    name: Backend Checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo, pdo_mysql, openssl
          coverage: xdebug

      - name: Copy .env
        run: php -r "file_exists('.env') || copy('.env.example', '.env');"

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Code style (Pint)
        run: ./vendor/bin/pint --test

      - name: Static analysis (PHPStan)
        run: composer analyse

      - name: Run tests with coverage
        run: php artisan config:clear && php -d xdebug.mode=coverage vendor/bin/phpunit --coverage-clover build/logs/clover.xml

  # ── 2. Frontend CI ────────────────────────────────────────────────────────
  frontend-checks:
    name: Frontend Checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: '20'
          cache: 'yarn'
          cache-dependency-path: frontend/yarn.lock

      - name: Install dependencies
        run: yarn install --ignore-scripts --frozen-lockfile

      - name: ESLint
        run: yarn lint

      - name: Build
        run: yarn build

  # ── 3. Deploy Staging (solo si ambos checks pasan) ───────────────────────
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [ backend-checks, frontend-checks ]
    environment: staging

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Notify staging deploy start
        run: echo "Deploying to Staging environment..."

      - name: Staging deploy complete
        run: echo "Staging deploy complete. Ready for smoke testing."