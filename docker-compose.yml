services:
  # Contenedor para el Frontend (React + Vite)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: development
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
      - VITE_API_URL=http://localhost:8000/api
      - VITE_STORAGE_KEY=prolecom_secure_key_2026_xyz
      # WebSocket Reverb — apunta al host de la máquina desde el navegador
      - VITE_REVERB_APP_KEY=local-key
      - VITE_REVERB_HOST=localhost
      - VITE_REVERB_PORT=8080
      - VITE_REVERB_SCHEME=http
    restart: always
    networks:
      - prolecom_network
    depends_on:
      backend:
        condition: service_started

  # Contenedor para el Backend (PHP + Apache)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    ports:
      - "8000:80"
    volumes:
      - ./backend:/var/www/html
      - /var/www/html/vendor
    environment:
      - DB_CONNECTION=mysql
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=prolecom
      - DB_USERNAME=root
      - DB_PASSWORD=root
      - APP_ENV=local
      - APP_DEBUG=true
      - APP_URL=http://localhost:8000
      - JUDGE0_URL=${JUDGE0_URL}
      - JUDGE0_HOST=${JUDGE0_HOST}
      # Broadcasting via Reverb
      - BROADCAST_CONNECTION=reverb
      - REVERB_APP_ID=1
      - REVERB_APP_KEY=local-key
      - REVERB_APP_SECRET=local-secret
      - REVERB_HOST=reverb
      - REVERB_PORT=8080
      - REVERB_SCHEME=http
    restart: always
    networks:
      - prolecom_network
    depends_on:
      db:
        condition: service_healthy

  # Servidor WebSocket Laravel Reverb
  reverb:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    ports:
      - "8080:8080"
    volumes:
      - ./backend:/var/www/html
      - /var/www/html/vendor
    environment:
      - DB_CONNECTION=mysql
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=prolecom
      - DB_USERNAME=root
      - DB_PASSWORD=root
      - APP_ENV=local
      - APP_DEBUG=true
      - APP_URL=http://localhost:8000
      - BROADCAST_CONNECTION=reverb
      - REVERB_APP_ID=1
      - REVERB_APP_KEY=local-key
      - REVERB_APP_SECRET=local-secret
      - REVERB_HOST=0.0.0.0
      - REVERB_PORT=8080
      - REVERB_SCHEME=http
    command: php artisan reverb:start --host=0.0.0.0 --port=8080 --debug
    restart: always
    networks:
      - prolecom_network
    depends_on:
      db:
        condition: service_healthy

  # Contenedor para la Base de Datos (MySQL)
  db:
    image: mysql:8.0
    ports:
      - "3307:3306"
    environment:
      MYSQL_DATABASE: prolecom
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - db_data:/var/lib/mysql
      - ./backend/scripts:/docker-entrypoint-initdb.d
    restart: always
    networks:
      - prolecom_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Herramienta de gestión de base de datos (movido a :8888 para liberar :8080 a Reverb)
  adminer:
    image: adminer
    restart: always
    ports:
      - "8888:8080"
    networks:
      - prolecom_network

  # Procesador de colas en segundo plano para calificar retos
  queue-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    volumes:
      - ./backend:/var/www/html
      - /var/www/html/vendor
    environment:
      - DB_CONNECTION=mysql
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=prolecom
      - DB_USERNAME=root
      - DB_PASSWORD=root
      - APP_ENV=local
      - APP_DEBUG=true
      - APP_URL=http://localhost:8000
      - JUDGE0_URL=${JUDGE0_URL}
      - JUDGE0_HOST=${JUDGE0_HOST}
      # Broadcasting via Reverb
      - BROADCAST_CONNECTION=reverb
      - REVERB_APP_ID=1
      - REVERB_APP_KEY=local-key
      - REVERB_APP_SECRET=local-secret
      - REVERB_HOST=reverb
      - REVERB_PORT=8080
      - REVERB_SCHEME=http
    command: php artisan queue:work --verbose --tries=3 --timeout=90
    restart: always
    networks:
      - prolecom_network
    depends_on:
      db:
        condition: service_healthy
      reverb:
        condition: service_started

  # Motor de ejecución de código Judge0 CE
  judge0-server:
    image: judge0/judge0:1.13.1
    ports:
      - "2358:2358"
    privileged: true
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    tmpfs:
      - /tmp
    environment:
      - POSTGRES_HOST=judge0-db
      - POSTGRES_USER=judge0
      - POSTGRES_PASSWORD=judge0
      - POSTGRES_DB=judge0
      - REDIS_HOST=judge0-redis
      - REDIS_PORT=6379
      - JUDGE0_ENABLE_PER_PROCESS_AND_THREAD_MEMORY_LIMIT=false
      - JUDGE0_ENABLE_PER_PROCESS_AND_THREAD_TIME_LIMIT=false
      - ENABLE_PER_PROCESS_AND_THREAD_MEMORY_LIMIT=false
      - ENABLE_PER_PROCESS_AND_THREAD_TIME_LIMIT=false
    restart: always
    networks:
      - prolecom_network
    depends_on:
      - judge0-db
      - judge0-redis

  judge0-db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: judge0
      POSTGRES_PASSWORD: judge0
      POSTGRES_DB: judge0
    volumes:
      - judge0_db_data:/var/lib/postgresql/data
    restart: always
    networks:
      - prolecom_network

  judge0-redis:
    image: redis:7-alpine
    restart: always
    networks:
      - prolecom_network

networks:
  prolecom_network:
    driver: bridge

volumes:
  db_data:
  judge0_db_data: